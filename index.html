<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e6" />
    <meta
      name="description"
      content="通过五个口味问题，找到适合你的鸡尾酒方向。"
    />
    <title>觅饮 · 今晚喝哪一杯</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='%23f2c94c' stroke='%23171715' stroke-width='5'/%3E%3Cpath d='M21 22h22l-3 25H24z' fill='%239e3328' stroke='%23171715' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">觅</span>
        <span>觅饮</span>
      </button>

      <div class="topbar-actions">
        <span class="step-count" id="stepCount" aria-live="polite">今晚 · 未开杯</span>
        <button class="icon-button is-hidden" id="restartButton" type="button" aria-label="重新开始" title="重新开始">
          <span aria-hidden="true">↻</span>
        </button>
      </div>
    </header>

    <main id="app">
      <section class="screen intro-screen is-active" id="introScreen" aria-labelledby="introTitle">
        <div class="intro-copy">
          <p class="eyebrow">YOUR DRINK, IN FIVE SIPS</p>
          <h1 id="introTitle">今晚，<br />喝哪一杯？</h1>
          <p class="intro-lead">说说你熟悉的味道，我替你把它翻译成一杯酒。</p>
          <button class="primary-button" id="startButton" type="button">
            <span>开始选酒</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </div>

        <div class="hero-art" aria-hidden="true">
          <div class="scribble scribble-one"></div>
          <div class="scribble scribble-two"></div>
          <div class="glass-stage intro-glass-stage">
            <div class="cocktail-glass intro-glass">
              <div class="glass-liquid"></div>
              <span class="ice ice-one"></span>
              <span class="ice ice-two"></span>
              <span class="garnish garnish-citrus"></span>
              <span class="bubble bubble-one"></span>
              <span class="bubble bubble-two"></span>
              <span class="bubble bubble-three"></span>
            </div>
            <span class="glass-shadow"></span>
          </div>
          <p class="hand-note note-one">先别看酒单</p>
          <p class="hand-note note-two">从喜欢的味道开始 ↗</p>
          <div class="doodle-face">
            <span class="eye"></span><span class="eye"></span><span class="mouth"></span>
          </div>
        </div>

        <div class="intro-footer" aria-label="体验摘要">
          <span>熟悉的味道</span>
          <span>真正的雷区</span>
          <span>今晚的节奏</span>
        </div>
      </section>

      <section class="screen quiz-screen" id="quizScreen" aria-labelledby="questionTitle">
        <div class="quiz-main">
          <div class="progress-wrap" aria-hidden="true">
            <span class="progress-label" id="progressLabel">01</span>
            <div class="progress-track"><span class="progress-fill" id="progressFill"></span></div>
            <span class="progress-total">05</span>
          </div>

          <div class="question-wrap" id="questionWrap">
            <p class="question-kicker" id="questionKicker"></p>
            <h2 id="questionTitle"></h2>
            <p class="question-note" id="questionNote"></p>
            <div class="option-grid" id="optionGrid"></div>
            <div class="question-actions">
              <button class="back-button" id="backButton" type="button" aria-label="上一题">
                <span aria-hidden="true">←</span><span>上一题</span>
              </button>
              <button class="primary-button next-button is-hidden" id="nextButton" type="button">
                <span>看看我的酒</span><span class="button-arrow" aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>

        <aside class="live-pour" aria-label="口味预览">
          <p class="live-label">正在调出你的方向</p>
          <div class="taste-cloud" id="tasteCloud">
            <span>待选择</span>
          </div>
          <div class="glass-stage quiz-glass-stage" aria-hidden="true">
            <div class="cocktail-glass live-glass" id="liveGlass">
              <div class="glass-liquid"></div>
              <span class="ice ice-one"></span>
              <span class="ice ice-two"></span>
              <span class="garnish garnish-citrus"></span>
              <span class="bubble bubble-one"></span>
              <span class="bubble bubble-two"></span>
              <span class="bubble bubble-three"></span>
            </div>
            <span class="glass-shadow"></span>
          </div>
          <p class="pour-caption" id="pourCaption">杯子还是空的，先挑一种熟悉的饮料。</p>
          <span class="pour-arrow" aria-hidden="true">↘</span>
        </aside>
      </section>

      <section class="screen result-screen" id="resultScreen" aria-labelledby="resultTitle">
        <div class="result-heading">
          <p class="eyebrow">YOUR MIDNIGHT MENU</p>
          <h2 id="resultTitle">你的今晚，<br /><span id="resultMood">适合轻松一点。</span></h2>
          <p class="profile-line" id="profileLine"></p>
          <div class="result-actions">
            <button class="primary-button copy-button" id="copyButton" type="button">
              <span class="copy-icon" aria-hidden="true">⧉</span>
              <span id="copyLabel">复制点单暗号</span>
            </button>
            <button class="text-button" id="resultRestartButton" type="button">重新测一次</button>
          </div>
        </div>

        <div class="recommendations" id="recommendations" aria-label="鸡尾酒推荐"></div>

        <div class="bartender-note">
          <span class="note-mark" aria-hidden="true">!</span>
          <p><strong>给调酒师看的话</strong><br /><span id="bartenderSentence"></span></p>
        </div>

        <p class="safety-note">口味推荐不代表酒精耐受。驾车、孕期、服药期间请勿饮酒；食物过敏请直接告诉调酒师。</p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
